# configs/benchmarks/corpus/t60_text_factory.yaml
# ─────────────────────────────────────────────────────────────────────────
# Benchmark corpus — Scene T60: TextFactory1080p (GPU overlay factory target)
# ─────────────────────────────────────────────────────────────────────────
# Purpose (user-spec verbatim): the canonical GPU-resident overlay factory
# benchmark.  1920x1080, 30 fps, 10 s (300 frames), composed of 5 animated
# text layers + 2 images + 1 logo, animated with position XYZ, rotation XYZ,
# scale, opacity and camera perspective.  No heavy blur, no DOF.
#
# This is the render-only throughput target: complexity stays in the
# text/image/transform/2.5D family so the GPU backend (Vulkan compute) is the
# bottleneck, not the codec.  The five canonical phases (scene_eval /
# gpu_render / gpu_readback / encode / disk_io) are the REQUIRED measurement
# axis — see render_telemetry_record.hpp::RenderPhaseTimings — so render
# speed is never conflated with encoding or I/O.
#
# This scene is a GPU program, distinct from the CPU-only B00-B11 ranking in
# examples/bench_corpus/corpus_v1.json.  Per AGENTS.md v0.1 Cat-3 + §honesty:
# metadata-only (zero new SDK surface); the overlay composition is
# FORWARD-POINTED (not yet registered) and every number below is a REFERENCE
# TARGET, not a measured result.
# ─────────────────────────────────────────────────────────────────────────

schema_version: "benchmark_corpus_v1"

scene_id: "T60"
display_name: "TextFactory1080p"
category: "gpu_overlay_factory"

intent: |
  Misura il throughput della GPU overlay factory: 5 layer di testo animato
  (position XYZ, rotation XYZ, scale, opacity, camera perspective) + 2
  immagini + 1 logo a 1920x1080 / 30 fps / 10 s (300 frame).  Stress sul
  batching delle istanze e sulla cache template/atlas, NON sul codec.  Le 5
  fasi canoniche (scene_eval, gpu_render, gpu_readback, encode, disk_io)
  separano il render dal collo di bottiglia encoding/I/O.

# ── Overlay composition under test (canonical spec) ──────────────────────
composition_spec:
  resolution: { width: 1920, height: 1080 }
  frame_rate: 30
  duration_seconds: 10
  frame_count: 300
  layers:
    - { kind: "text",  count: 5, role: "headline / quote / caption" }
    - { kind: "image", count: 2, role: "background / hero" }
    - { kind: "logo",  count: 1, role: "brand mark" }
  animations:
    - "position_xyz"
    - "rotation_xyz"
    - "scale"
    - "opacity"
    - "camera_perspective"
  excluded_effects:
    - "heavy_blur"
    - "depth_of_field"

comp_id: "TBD"
comp_id_target_spec:
  kind: "gpu_overlay_factory"
  batch_mode: "single_command_batch"       # N overlays → one vkQueueSubmit
  template_cache: "compiled_overlay_template"  # compile shader/pipeline/atlas once
  instance_data: "per-overlay parameter sets (transform / color / timing)"

canonical_render:
  command: "chronon3d_cli video <PLACEHOLDER:TextFactory1080p-comp> --start 0 --end 10 --fps 30"
  output_path: "/tmp/benchmark_corpus_t60.mp4"

# ── GPU target ladder (render-only, per 10 s overlay) ────────────────────
# Reference targets only — NOT measured baselines (see §honesty).  Each
# target is the render-only cost of ONE overlay; the 5 canonical phases must
# be reported alongside so render is never conflated with codec/IO.
gpu_targets:
  baseline_cpu_seconds: 10.0        # current software-render baseline
  target_v1_seconds: 1.0            # first GPU milestone (<= 1.0 s)
  target_v2_seconds: 0.5            # good milestone (<= 500 ms)
  target_optimized_seconds: 0.25    # render-only 100–300 ms envelope
  dimensioning_overlays_per_day: 5000   # dimension for 5k/day, headroom to 50k/day

frame_rates: [30]
resolution_options: [{ width: 1920, height: 1080 }]
duration_seconds_options: [10]

# ── Required per-phase measurement axis ───────────────────────────────────
expected_metrics:
  - phase_scene_eval_ms
  - phase_gpu_render_ms
  - phase_gpu_readback_ms
  - phase_encode_ms
  - phase_disk_io_ms
  - overlay_total_ms           # scene_eval + gpu_render + gpu_readback + encode + disk_io
  - submissions_per_batch      # must be 1 for N overlays in one command batch
  - physical_surface_count     # aliasing proof (lifetime-disjoint surfaces share slots)
  - frame_p50_ms
  - frame_p95_ms
  - peak_rss_mb
  - output_hash_pixels

forward_points:
  - { name: "register TextFactory1080p GPU overlay composition", ticket: "TICKET-BENCH-T60-COMPOSITION" }
  - { name: "batch N overlays into one vkQueueSubmit (command batch)", ticket: "TICKET-BENCH-T60-COMMAND-BATCH" }
  - { name: "template + per-instance parameter cache (CompiledOverlayTemplate)", ticket: "TICKET-BENCH-T60-TEMPLATE-CACHE" }
  - { name: "per-phase timer certification for the overlay factory", ticket: "TICKET-BENCH-T60-PHASE-TIMERS" }

cross_link:
  - "include/chronon3d/runtime/telemetry/render_telemetry_record.hpp (RenderPhaseTimings)"
  - "include/chronon3d/render_graph/render_backend.hpp (begin_command_batch / end_command_batch)"
  - "include/chronon3d/runtime/gpu_command_plan.hpp (CommandPlan)"
  - "src/backends/vulkan/vulkan_backend.cpp (command-batch submission)"
  - "configs/benchmark_machines.yaml"
