name: Native Video Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_COMMIT: 'cb2981c4e03d421fa03b9bb5044cd1986180e7e4'

jobs:
  native-video-contract:
    name: Native FFmpeg sink contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native video build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ninja-build ccache pkg-config mono-complete ffmpeg
        # libavcodec/libavformat/libavutil/libswscale are now declared as the
        # vcpkg `native-ffmpeg` manifest feature (vcpkg.json); the ffmpeg CLI
        # binary remains a system package for the integration contract.

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.10

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Configure native video contract build
        run: |
          cmake --preset linux-video-test \
            -DCHRONON3D_ENABLE_VULKAN=OFF \
            -DCHRONON3D_ENABLE_CUDA_INTEROP=OFF \
            -DCHRONON3D_ENABLE_TEXT=OFF \
            -DCHRONON3D_USE_BLEND2D=OFF \
            -DCHRONON3D_ENABLE_IPC=OFF \
            -DVCPKG_MANIFEST_FEATURES='cli;native-ffmpeg;tests'

      - name: Build native sink certification target
        run: |
          cmake --build --preset linux-video-test \
            --target chronon3d_native_video_sink_factory_tests

      - name: Run native H264/H265/raw sink contracts
        run: |
          ctest --test-dir build/chronon/linux-video-test \
            -R '^chronon3d_native_video_sink_factory_tests$' \
            --output-on-failure

  # The job above configures `linux-video-test` with Vulkan OFF, so nothing in
  # CI compiled the Vulkan-gated suites. That is how the 2026-09-13 merge
  # landed a non-compiling HEAD (authority methods swallowed into `private:`) and
  # two stale assertions (see docs/tickets/TICKET-AUDIT-2026-09-12-REMEDIATION.md,
  # "quarta sessione"). This job is that missing check: it builds and runs the
  # headless Vulkan-gated unit/integration suites.
  vulkan-gated-unit:
    name: Vulkan-gated unit suites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan lane build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ninja-build ccache pkg-config
        # The Vulkan loader, shaderc and spirv-reflect come from the vcpkg
        # manifest `vulkan` feature, not from system packages.

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Build + run the Vulkan-gated unit suites
        run: bash scripts/ci/verify_vulkan_gated_unit_tests.sh
