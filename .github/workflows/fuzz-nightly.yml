name: libFuzzer nightly campaign

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per target'
        required: false
        default: '300'

permissions:
  contents: read

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
  VCPKG_COMMIT: 'cb2981c4e03d421fa03b9bb5044cd1986180e7e4'

jobs:
  fuzz:
    name: ASan UBSan coverage-guided campaign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore persistent fuzz corpus
        uses: actions/cache@v4
        with:
          path: build/fuzz-persistent-corpus
          key: ${{ runner.os }}-chronon3d-fuzz-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-chronon3d-fuzz-${{ github.ref_name }}-

      - name: Install Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Configure and build fuzzers
        run: |
          cmake --preset linux-fuzz
          cmake --build --preset linux-fuzz --target \
            ipc_codec_fuzz maybe_expression_fuzz composition_descriptor_fuzz \
            generate_ipc_fuzz_corpus -j12

      - name: Run coverage-guided campaign
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '60' }}
          FUZZ_ARTIFACT_DIR: build/fuzz-artifacts
          IPC_FUZZ_BINARY: build/chronon/linux-fuzz/tests/fuzz/ipc_codec_fuzz
          EXPRESSION_FUZZ_BINARY: build/chronon/linux-fuzz/tests/fuzz/maybe_expression_fuzz
          DESCRIPTOR_FUZZ_BINARY: build/chronon/linux-fuzz/tests/fuzz/composition_descriptor_fuzz
          IPC_FUZZ_CORPUS: build/chronon/linux-fuzz/tests/fuzz/corpus/ipc
          EXPRESSION_FUZZ_CORPUS: build/fuzz-persistent-corpus/expression
          DESCRIPTOR_FUZZ_CORPUS: build/fuzz-persistent-corpus/descriptor
        run: |
          mkdir -p build/fuzz-persistent-corpus/expression build/fuzz-persistent-corpus/descriptor
          cp -an tests/fuzz/corpus/expression/. build/fuzz-persistent-corpus/expression/
          cp -an tests/fuzz/corpus/descriptor/. build/fuzz-persistent-corpus/descriptor/
          bash tools/run_fuzz_campaign.sh

      - name: Upload persistent corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronon3d-fuzz-corpus
          path: |
            build/chronon/linux-fuzz/tests/fuzz/corpus
            build/fuzz-persistent-corpus
            build/fuzz-artifacts
          retention-days: 14
