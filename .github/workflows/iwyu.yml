name: IWYU advisory

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iwyu:
    name: include-what-you-use report
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install IWYU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq include-what-you-use

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: cb2981c4e03d421fa03b9bb5044cd1986180e7e4

      - name: Configure compile database
        run: cmake --preset linux-fast-dev

      - name: Generate advisory report
        run: |
          IWYU_REPORT="$RUNNER_TEMP/chronon3d-iwyu.txt" \
            bash tools/run_iwyu_advisory.sh build/chronon/linux-fast-dev

      - name: Upload advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronon3d-iwyu-report
          path: ${{ runner.temp }}/chronon3d-iwyu.txt
          if-no-files-found: warn
          retention-days: 14
