name: Cleanup temporary branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-temp-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete accidental temporary branches and self-remove
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "Chronon3D Agent"
          git config user.email "chronon3d-agent@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" --delete tmp-should-not-use tmp-should-not-use2
          git rm .github/workflows/cleanup-temp-branches.yml
          git commit -m "chore: remove temporary branch cleanup workflow"
          git push "$remote" HEAD:main
