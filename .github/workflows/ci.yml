name: Chronon CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT: 'cb2981c4e03d421fa03b9bb5044cd1986180e7e4'
  # Hosted runners ran out of disk during the full Debug build: the runner
  # process itself died with "No space left on device" while compiling
  # chronon3d_tests. Drop each port's build tree as soon as it is installed and
  # keep ccache bounded; the preinstalled SDK cleanup step below frees the rest.
  VCPKG_INSTALL_OPTIONS: "--clean-after-build"
  CCACHE_MAXSIZE: "2G"
  # Hosted runners have 4 vCPUs; capping the build keeps peak memory bounded
  # (the uncapped Linux Debug lane lost the runner to an OOM kill).
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  CHRONON3D_UPDATE_GOLDENS: ${{ secrets.CHRONON3D_UPDATE_GOLDENS || '' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-matrix:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(github.event_name == 'push' && '[{"name":"Linux (Debug/CI)","os":"ubuntu-24.04","preset":"linux-ci","build_preset":"linux-ci","test_preset":"linux-ci-test","slug":"linux-debug-ci"}]' || '[{"name":"Linux (Release)","os":"ubuntu-24.04","preset":"linux-ci-release-build","build_preset":"linux-ci-release-build","test_preset":"linux-ci-release-build-test","slug":"linux-release"},{"name":"Linux (Debug/CI)","os":"ubuntu-24.04","preset":"linux-ci","build_preset":"linux-ci","test_preset":"linux-ci-test","slug":"linux-debug-ci"},{"name":"Linux (No Content)","os":"ubuntu-24.04","preset":"linux-ci-nocontent","build_preset":"linux-ci-nocontent","test_preset":"linux-ci-nocontent-test","slug":"linux-nocontent"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: ${{ github.event_name == 'push' }}

      - name: Verify same-SHA checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "checkout SHA $actual != event SHA $env:GITHUB_SHA" }
          Write-Host "same-SHA verified: $actual"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache mono-complete pkg-config

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          # The image ships SDKs this build never uses; removing them is the
          # difference between a finished full build and the runner dying on
          # ENOSPC (runs 5124-5134 all lost the disk mid-build).
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - name: Gate / Test Hygiene
        if: runner.os == 'Linux'
        run: bash tools/check_test_hygiene.sh

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.10

      - name: Install Linux vcpkg prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-vcpkg-prerequisites

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      # vcpkg re-downloads every source tarball on each run. A transient
      # github.com / upstream timeout then fails Configure before any compiler
      # runs (the 2026-11-08 main run died this way on two portfiles). Persist
      # the resolved downloads and let the retry below reuse them.
      - name: Restore vcpkg source downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Initialize MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: |
          for attempt in 1 2 3; do
            if cmake --preset ${{ matrix.config.preset }}; then
              exit 0
            fi
            echo "::warning::configure attempt ${attempt}/3 failed; retrying in 15s"
            sleep 15
          done
          echo "::error::configure failed after 3 attempts"
          exit 1

      - name: Build fast tests (PR / push)
        if: github.event_name != 'workflow_dispatch'
        run: cmake --build --preset ${{ matrix.config.build_preset }} --target chronon3d_tests_fast

      - name: Build full tests (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: cmake --build --preset ${{ matrix.config.build_preset }} --target chronon3d_tests

      - name: Run fast tests (PR / push)
        if: github.event_name != 'workflow_dispatch'
        run: |
          ctest --preset ${{ matrix.config.test_preset }} \
            -R "chronon3d_core_tests|chronon3d_scene_tests|chronon3d_cli_tests|chronon3d_render_job_contract_tests|chronon3d_optimizer_tests|chronon3d_cache_tests|chronon3d_compositor_tests|chronon3d_motion_plan_adapter_tests|chronon3d_backend_registry_tests" \
            --output-on-failure --output-junit "${{ github.workspace }}/test-results-${{ matrix.config.slug }}.xml"
      - name: Run RenderPlan v2/v3 adapter interoperability gate
        if: runner.os == 'Linux'
        run: |
          cmake --preset linux-ci-motion-adapter
          cmake --build --preset linux-ci-motion-adapter --target chronon3d_motion_plan_adapter_tests
          ctest --preset linux-ci-motion-adapter-test -R '^chronon3d_motion_plan_adapter_tests$' --output-on-failure

      - name: Run full tests (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          ctest --preset ${{ matrix.config.test_preset }} \
            --output-on-failure --output-junit "${{ github.workspace }}/test-results-${{ matrix.config.slug }}.xml"

      - name: Clang-Tidy (PR, Linux only)
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: |
          TIDY=$(command -v clang-tidy-18 || command -v clang-tidy-17 || command -v clang-tidy-16 || command -v clang-tidy || true)
          if [ -z "$TIDY" ]; then echo "clang-tidy not found; skipping"; exit 0; fi
          BUILD_DIR="build/chronon/${{ matrix.config.preset }}"
          find src include apps -name '*.cpp' -o -name '*.hpp' | \
            xargs $TIDY --quiet --config-file=.clang-tidy -p "$BUILD_DIR" 2>&1 | tee clang-tidy-report.txt
          if grep -q "error:" clang-tidy-report.txt; then exit 1; fi

      - name: Generate CI status JSON
        if: runner.os == 'Linux'
        run: |
          python3 tools/ci_status_from_junit.py \
            --junit "${{ github.workspace }}/test-results-${{ matrix.config.slug }}.xml" \
            --commit "${{ github.sha }}" --workflow "${{ github.workflow }}" --out "ci_status.json"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ci-status-${{ github.sha }}
          path: ci_status.json
          retention-days: 90
          if-no-files-found: ignore

  windows-release:
    # Manual-only release proof for the preset in cmake/presets/windows.json.
    # It used to run on every push/PR, but a hosted Windows Configure alone
    # takes ~50 minutes and the lane is not part of main-truth. Keep the push
    # lane fast: run this with workflow_dispatch when cutting a release or
    # validating the Windows preset.
    if: github.event_name == 'workflow_dispatch'
    name: Windows (Release)
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: ${{ github.event_name == 'push' }}

      - name: Verify same-SHA checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "checkout SHA $actual != event SHA $env:GITHUB_SHA"
          }
          Write-Host "same-SHA verified: $actual"

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.10

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Initialize MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore vcpkg source downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Configure (Windows Release)
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cmake --preset win-release
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::configure attempt $attempt/3 failed; retrying in 15s"
            Start-Sleep -Seconds 15
          }
          Write-Error "configure failed after 3 attempts"
          exit 1

      - name: Build release CLI and focused tests (PR / push)
        if: github.event_name != 'workflow_dispatch'
        run: cmake --build --preset win --target chronon3d_cli chronon3d_tests_fast

      - name: Build release CLI and full tests (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: cmake --build --preset win --target chronon3d_cli chronon3d_tests

      - name: Run focused release tests (PR / push)
        if: github.event_name != 'workflow_dispatch'
        run: >-
          ctest --preset win-test
          -R "chronon3d_core_tests|chronon3d_scene_tests|chronon3d_cli_tests|chronon3d_render_job_contract_tests|chronon3d_optimizer_tests|chronon3d_cache_tests|chronon3d_compositor_tests|chronon3d_motion_plan_adapter_tests|chronon3d_backend_registry_tests"
          --output-on-failure --output-junit "${{ github.workspace }}/windows-test-results.xml"

      - name: Run full release suite (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: ctest --preset win-test --output-on-failure --output-junit "${{ github.workspace }}/windows-test-results.xml"

      - name: Generate same-SHA test status
        run: >-
          python tools/ci_status_from_junit.py
          --junit "${{ github.workspace }}/windows-test-results.xml"
          --commit "${{ github.sha }}"
          --workflow "${{ github.workflow }}"
          --out windows-release-receipt/ci_status.json

      - name: Generate SHA-256 release manifest
        run: >-
          python tools/windows_release_manifest.py
          --build-dir build/chronon/win-release
          --commit "${{ github.sha }}"
          --version-file version.txt
          --preset win-release
          --out-dir windows-release-receipt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: |
            windows-release-receipt/
            windows-test-results.xml
          retention-days: 90
          if-no-files-found: error

  golden-e2e:
    # Manual-only golden gate: it rebuilds the software renderer and is too
    # slow for the push lane. main-truth only requires the Linux fast lane.
    if: github.event_name == 'workflow_dispatch'
    name: Gate 8 / golden-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache pkg-config

      - name: Free disk space (Linux)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.10

      - name: Install Linux vcpkg prerequisites
        uses: ./.github/actions/linux-vcpkg-prerequisites

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Restore vcpkg source downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      # Same proven lane as svg-motion.yml, with GPU and native FFmpeg off:
      # the golden gate exercises the software renderer, not a GPU backend.
      - name: Configure software render build
        run: |
          cmake --preset linux-video-test \
            -DCHRONON3D_ENABLE_VULKAN=OFF \
            -DCHRONON3D_ENABLE_CUDA_INTEROP=OFF \
            -DCHRONON3D_ENABLE_IPC=OFF \
            -DCHRONON3D_ENABLE_NATIVE_FFMPEG=OFF \
            -DCHRONON3D_BUILD_CLI_RENDER=ON \
            -DCHRONON3D_ENABLE_VIDEO=ON \
            -DCHRONON3D_ENABLE_TEXT=ON \
            -DCHRONON3D_USE_BLEND2D=ON \
            -DVCPKG_MANIFEST_FEATURES='cli;blend2d;text;tests'

      - name: Build CLI
        run: cmake --build --preset linux-video-test --target chronon3d_cli

      - name: Golden E2E (3 scenes, double render, per-frame SHA-256)
        run: |
          ctest --test-dir build/chronon/linux-video-test \
            -R '^chronon3d_golden_e2e_tests$' --output-on-failure

  core-build:
    if: github.event_name != 'push'
    name: Gate 1 / core-build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: ${{ github.event_name == 'push' }}
      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache mono-complete pkg-config
      - name: Install Linux vcpkg prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-vcpkg-prerequisites

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - run: cmake --preset linux-ci-core-gate
      - run: cmake --build --preset linux-ci-core-gate
      - run: ctest --preset linux-ci-core-gate-test --output-on-failure

  sdk-build:
    if: github.event_name != 'push'
    name: Gate 2 / sdk-build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: ${{ github.event_name == 'push' }}
      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache mono-complete pkg-config
      - name: Install Linux vcpkg prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-vcpkg-prerequisites

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - run: cmake --preset linux-ci-lean-gate
      - run: cmake --build --preset linux-ci-lean-gate
      - run: ctest --preset linux-ci-lean-gate-test --output-on-failure

  public-header-check:
    if: github.event_name != 'push'
    name: Gate 3 / public-header-check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: ${{ github.event_name == 'push' }}
      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache mono-complete pkg-config
      - name: Install Linux vcpkg prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-vcpkg-prerequisites

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - run: cmake --preset linux-ci-lean-gate -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: cmake --build --preset linux-ci-lean-gate --target chronon3d_cli
      - name: Compile each header standalone
        run: |
          # Canonical interface of the gate (tools/check_public_headers.py
          # header, lines 9-10): the manifest is the source of truth for the
          # public header set and the script derives Gates A/B/C from it. The
          # old `--headers-list headers.txt` form is a stale interface the
          # script no longer accepts, so this step could never run the check.
          python3 tools/check_public_headers.py \
            --compile-commands build/chronon/linux-ci-lean-gate/compile_commands.json \
            --manifest cmake/Chronon3DPublicHeaders.cmake --out out
          if [ -s out/failures.txt ]; then
            echo "::error::Public headers that fail to compile standalone:"
            cat out/failures.txt
            exit 1
          fi

  install-consumer-check:
    if: github.event_name != 'push'
    name: Gate 4 / install-consumer-check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: ${{ github.event_name == 'push' }}
      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache mono-complete pkg-config
      - name: Install Linux vcpkg prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-vcpkg-prerequisites

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - name: Configure SDK distribution build
        run: cmake --preset linux-ci -DCMAKE_INSTALL_PREFIX=$PWD/sdk-dist
      - name: Build SDK distribution
        run: cmake --build build/chronon/linux-ci --target chronon3d_sdk_impl chronon3d_c
      - name: Install SDK distribution
        run: |
          rm -rf sdk-dist
          cmake --install build/chronon/linux-ci --prefix "$PWD/sdk-dist"
          test -f sdk-dist/lib/cmake/Chronon3D/Chronon3DConfig.cmake
          test -f sdk-dist/include/chronon3d/c_api/chronon3d.h
      - name: Build external consumer project
        run: |
          mkdir -p consumer
          printf 'cmake_minimum_required(VERSION 3.25)\n' > consumer/CMakeLists.txt
          printf 'project(chronon_consumer LANGUAGES CXX)\n' >> consumer/CMakeLists.txt
          printf 'set(CMAKE_CXX_STANDARD 20 CACHE STRING \"\")\n' >> consumer/CMakeLists.txt
          printf 'set(CMAKE_CXX_STANDARD_REQUIRED ON CACHE BOOL \"\")\n' >> consumer/CMakeLists.txt
          printf 'find_package(Chronon3D CONFIG REQUIRED)\n' >> consumer/CMakeLists.txt
          printf 'add_executable(chronon_consumer main.cpp)\n' >> consumer/CMakeLists.txt
          printf 'target_link_libraries(chronon_consumer PRIVATE Chronon3D::SDK)\n' >> consumer/CMakeLists.txt
          # The smoke source must use a type the included header actually
          # declares: `chronon3d/sdk/render_settings.hpp` exposes
          # `chronon3d::sdk::RenderSettings`. The old `chronon3d::Color` (which
          # lives in chronon3d/math/color.hpp) made this step fail to compile
          # with "'Color' is not a member of 'chronon3d'".
          printf '#include <chronon3d/sdk/render_settings.hpp>\n' > consumer/main.cpp
          printf 'int main() { chronon3d::sdk::RenderSettings s{}; (void)s; return 0; }\n' >> consumer/main.cpp
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH=$PWD/sdk-dist
          cmake --build consumer/build

  architecture-check:
    if: github.event_name != 'push'
    name: Gate 5 / architecture-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps (tomli for py<3.11)
        run: pip install tomli 2>/dev/null || true
      - name: Unified architecture rules engine
        run: python3 tools/check_architecture.py
      - name: Public-target rule (Chronon3D::SDK / Chronon3D::C only)
        run: bash tools/check_public_targets.sh

  install-consumer-script:
    if: github.event_name != 'push'
    name: Gate 6 / install-consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: ${{ github.event_name == 'push' }}
      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache mono-complete pkg-config
      - name: Install Linux vcpkg prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-vcpkg-prerequisites

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - run: bash tools/install_consumer_test.sh

  sdk-product-certification:
    if: github.event_name != 'push'
    name: Gate 7 / sdk-product-certification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache mono-complete pkg-config
      - name: Install Linux vcpkg prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-vcpkg-prerequisites

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk_consumers/03_go/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - run: bash tools/verify_sdk_product.sh

  fuzz-regressions:
    if: github.event_name != 'push'
    name: Fuzz regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install fuzz toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang ninja-build ccache mono-complete pkg-config
      - name: Install Linux vcpkg prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-vcpkg-prerequisites

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - run: cmake --preset linux-fuzz
      - run: cmake --build --preset linux-fuzz
      - run: ctest --preset linux-fuzz-test --output-on-failure

  gate-status:
    name: Gate Status Summary
    if: ${{ !cancelled() && github.event_name != 'push' }}
    needs: [core-build, sdk-build, public-header-check, install-consumer-check, architecture-check, install-consumer-script, fuzz-regressions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate gate status JSON
        run: |
          python3 -c "
          import json, datetime
          gates = {
              'core-build':             '${{ needs.core-build.result }}',
              'sdk-build':              '${{ needs.sdk-build.result }}',
              'public-header-check':    '${{ needs.public-header-check.result }}',
              'install-consumer-check': '${{ needs.install-consumer-check.result }}',
              'architecture-check':     '${{ needs.architecture-check.result }}',
              'install-consumer-script':'${{ needs.install-consumer-script.result }}',
              'fuzz-regressions':       '${{ needs.fuzz-regressions.result }}',
          }
          passed = sum(1 for v in gates.values() if v == 'success')
          status = {
              'schema_version': 1,
              'commit': '${{ github.sha }}',
              'tested_at': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              'workflow': '${{ github.workflow }}',
              'gates': gates,
              'gates_total': len(gates),
              'gates_passed': passed,
              'gates_failed': len(gates) - passed,
              'gates_passed_bool': passed == len(gates),
          }
          with open('ci_gates_status.json', 'w') as f:
              json.dump(status, f, indent=2); f.write('\n')
          print(json.dumps(status, indent=2))
          "
      - uses: actions/upload-artifact@v4
        with:
          name: ci-gates-status-${{ github.sha }}
          path: ci_gates_status.json
          retention-days: 90

  # Compile-coverage authority for feature-gated TUs (AUDIT-2026-09-12 P0-1).
  # Runs on PRs so the SVG/EXR/MESH/C-API/DAEMON/CRASH_HANDLER/DEV_WATCH TUs
  # cannot rot between pushes.  The full ctest run needs LFS fixtures, so it
  # stays push-only; on PRs this lane is compile-only.
  full-validation:
    if: github.event_name != 'push'
    name: Full validation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: ${{ github.event_name == 'push' }}
      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache mono-complete pkg-config
      - name: Canonical architecture and test registration gate
        run: python3 tools/check_architecture.py
      - name: Install Linux vcpkg prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-vcpkg-prerequisites

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - name: Request configured CMake codemodel
        run: |
          mkdir -p build/chronon/linux-ci-full-validation/.cmake/api/v1/query
          : > build/chronon/linux-ci-full-validation/.cmake/api/v1/query/codemodel-v2
      - run: cmake --preset linux-ci-full-validation
      - name: Configured architecture codemodel gate
        run: python3 tools/check_architecture.py --build-dir build/chronon/linux-ci-full-validation
      - name: Build (feature-gated compile coverage on PR)
        run: cmake --build --preset linux-ci-full-validation
      - name: Run full test suite (push only — fixtures require LFS)
        if: github.event_name == 'push'
        run: ctest --preset linux-ci-full-validation-test --output-on-failure

  validate:
    if: github.event_name != 'push'
    name: Lint & Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n tools/*.sh
      - name: Check changed CMake formatting
        run: bash tools/check_cmake_format.sh
      - name: Detect stale docs paths
        run: |
          ERRORS=0
          while IFS= read -r line; do
            for path in $(echo "$line" | grep -oP '(?<=`)[a-zA-Z0-9_/.-]+(?=`)' | grep -v '^http'); do
              echo "$path" | grep -qE '^\.\./|^/|\.(h|cpp|py|jsx|ts|json|md|sh)$' || continue
              if [ ! -f "$path" ] && [ ! -d "$path" ]; then
                if [ ! -f "docs/$path" ] && [ ! -f "src/$path" ] && [ ! -f "tests/$path" ]; then
                  echo "WARNING: Possible stale path in docs: $path"
                  ERRORS=$((ERRORS + 1))
                fi
              fi
            done
          done < <(find docs/ -name '*.md' -exec cat {} \;)
          if [ "$ERRORS" -gt 0 ]; then
            echo "Found $ERRORS potential stale paths in documentation"
          else
            echo "All documentation paths appear valid"
          fi

  render-contract:
    if: github.event_name != 'push'
    name: RenderJob / ${{ matrix.config.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: 'Video enabled', preset: linux-ci-render-video-contract, build_preset: linux-ci-render-video-contract, test_preset: linux-ci-render-video-contract-test, core_only: false }
          - { name: 'Video disabled', preset: linux-ci-render-image-contract, build_preset: linux-ci-render-image-contract, test_preset: linux-ci-render-image-contract-test, core_only: false }
          - { name: 'CLI core-only', preset: linux-ci-cli-core-only, build_preset: linux-ci-cli-core-only, test_preset: '', core_only: true }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free disk space
        run: |
          # The hosted runner image preinstalls several SDKs that this job
          # never uses. Removing them keeps the vcpkg tree plus the 500+
          # object archive from filling the 14 GiB workspace disk.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup
          sudo apt-get clean
          df -h
      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache mono-complete pkg-config
      - name: Architecture regression guard
        run: python3 tools/check_architecture.py
      - name: Install Linux vcpkg prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-vcpkg-prerequisites

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - run: cmake --preset ${{ matrix.config.preset }}
      - run: cmake --build --preset ${{ matrix.config.build_preset }}
      - name: Run RenderJob contract
        if: ${{ ! matrix.config.core_only }}
        run: ctest --preset ${{ matrix.config.test_preset }} -R '^chronon3d_render_job_contract_tests$' --output-on-failure
      - name: Smoke core-only CLI
        if: ${{ matrix.config.core_only }}
        run: build/chronon/${{ matrix.config.preset }}/apps/chronon3d_cli/chronon3d_cli --help

  benchmarks:
    if: github.event_name != 'push'
    name: Benchmarks
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache mono-complete pkg-config
      - name: Install Linux vcpkg prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-vcpkg-prerequisites

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - run: cmake --preset linux-ci -DCHRONON3D_BUILD_BENCHMARKS=ON -DVCPKG_MANIFEST_FEATURES='tests;ipc;benchmarks'
      - run: cmake --build build/chronon/linux-ci --target chronon3d_benchmarks --target chronon3d_scene_program_benchmarks -j$(nproc)
      - name: Run blend benchmark
        id: bench-blend
        continue-on-error: true
        run: |
          mkdir -p output/benchmarks
          BIN="build/chronon/linux-ci/tests/chronon3d_benchmarks"
          if [ -f "$BIN" ]; then $BIN --benchmark_min_time=0.01 --benchmark_out=output/benchmarks/bench_blend.json --benchmark_out_format=json 2>&1 | tee output/benchmarks/bench_blend_output.txt; fi
      - name: Run program benchmark
        id: bench-program
        continue-on-error: true
        run: |
          mkdir -p output/benchmarks
          BIN="build/chronon/linux-ci/tests/chronon3d_scene_program_benchmarks"
          if [ -f "$BIN" ]; then $BIN --benchmark_min_time=0.01 --benchmark_out=output/benchmarks/bench_program.json --benchmark_out_format=json 2>&1 | tee output/benchmarks/bench_program_output.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.run_id }}
          path: output/benchmarks/
          retention-days: 30
