name: Chronon Nightly

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 3 * * 0'
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      sanitizer:
        description: 'Which sanitizer to run (asan or tsan)'
        required: false
        default: 'asan'
        type: choice
        options: [asan, tsan, both]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
  VCPKG_COMMIT: 'cb2981c4e03d421fa03b9bb5044cd1986180e7e4'

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  asan-ubsan:
    name: Sanitizer / ASan+UBSAN
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.sanitizer == 'asan' || github.event.inputs.sanitizer == 'both'))
      || github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build mono-complete pkg-config
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - run: cmake --preset linux-asan
      - run: cmake --build --preset linux-asan --target chronon3d_cli chronon3d_tests
      - run: ctest --preset linux-asan-test --output-on-failure

  tsan:
    name: Sanitizer / TSan
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.sanitizer == 'tsan' || github.event.inputs.sanitizer == 'both'))
      || github.event.schedule == '0 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build mono-complete pkg-config
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - run: cmake --preset linux-tsan
      - run: cmake --build --preset linux-tsan --target chronon3d_cli chronon3d_tests
      - run: ctest --preset linux-tsan-test --output-on-failure

  sanitizer-status:
    name: Sanitizer baseline status
    if: ${{ !cancelled() }}
    needs: [asan-ubsan, tsan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED: ${{ github.event.inputs.sanitizer }}
          ASAN_RESULT: ${{ needs.asan-ubsan.result }}
          TSAN_RESULT: ${{ needs.tsan.result }}
        run: |
          required=""
          if [[ "$EVENT_NAME" == "push" || "$SCHEDULE" == "0 2 * * *" ]]; then required="asan"
          elif [[ "$SCHEDULE" == "0 3 * * 0" ]]; then required="tsan"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then required="$REQUESTED"
          fi
          case "$required" in
            asan) [[ "$ASAN_RESULT" == "success" ]] || { echo "GATE_FAIL: ASan/UBSan baseline result=$ASAN_RESULT" >&2; exit 1; } ;;
            tsan) [[ "$TSAN_RESULT" == "success" ]] || { echo "GATE_FAIL: TSan baseline result=$TSAN_RESULT" >&2; exit 1; } ;;
            both) [[ "$ASAN_RESULT" == "success" && "$TSAN_RESULT" == "success" ]] || { echo "GATE_FAIL: asan=$ASAN_RESULT tsan=$TSAN_RESULT" >&2; exit 1; } ;;
            *) echo "GATE_FAIL: no sanitizer lane selected" >&2; exit 1 ;;
          esac
          echo "GATE_PASS: sanitizer baseline=$required (asan=$ASAN_RESULT tsan=$TSAN_RESULT)"

  cinematic-full:
    name: Nightly cinematic full (5 comps × 6 keyframes)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build mono-complete pkg-config
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - run: cmake --preset linux-ci
      - run: cmake --build build/chronon/linux-ci --target chronon3d_cinematic_camera_showcase_tests --target chronon3d_tests_render -j$(nproc)
      - name: 'Verify cinematic showcase (FULL: 5 × 6)'
        env:
          CHRONON3D_CINEMATIC_FRAME_COUNT: '6'
          CHRONON3D_CINEMATIC_COMP_COUNT: '5'
        run: bash tools/verify_cinematic_showcase.sh
      - name: 'Render contact sheet (FULL: 5760×2160)'
        env:
          CHRONON3D_CINEMATIC_FRAME_COUNT: '6'
          CHRONON3D_CINEMATIC_COMP_COUNT: '5'
        run: bash tools/render_showcase_contact_sheet.sh
      - name: Collect nightly artefacts
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f output/showcase/contact_sheet.png ]; then
            cp output/showcase/contact_sheet.png artifacts/contact_sheet.png
            sha256sum output/showcase/contact_sheet.png > artifacts/contact_sheet.png.sha256
          fi
          if [ -d output/showcase ]; then
            find output/showcase -maxdepth 2 -type f \( -name '*.png' -o -name '*.log' -o -name '*.txt' -o -name '*.json' \) \
              -exec cp --parents {} artifacts/ \; 2>/dev/null || true
          fi
          for sub in debug diff camera_visual; do
            if [ -d "output/${sub}" ]; then cp -r "output/${sub}" "artifacts/${sub}/" 2>/dev/null || true; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-visual-${{ github.run_id }}
          path: artifacts/
          retention-days: 60
          if-no-files-found: warn

  profile-envelope:
    name: Profile envelope (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
          - profile: motion
          - profile: video
          - profile: extended
            build_args: "--build --parallel 16"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build mono-complete pkg-config
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - run: chmod +x tools/measure_profile.sh
      - name: Measure profile (${{ matrix.profile }})
        run: bash tools/measure_profile.sh "${{ matrix.profile }}" ${{ matrix.build_args }}
      - uses: actions/upload-artifact@v4
        with:
          name: profile-${{ matrix.profile }}-measurement
          path: |
            build/profiles/linux-profile-${{ matrix.profile }}/profile-measurement.json
            build/profiles/linux-profile-${{ matrix.profile }}/profile-measurement.md
          if-no-files-found: warn
          retention-days: 30
