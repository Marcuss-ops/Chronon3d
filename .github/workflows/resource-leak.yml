name: Resource leak certification

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 4 * * 3'
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
  VCPKG_COMMIT: 'cb2981c4e03d421fa03b9bb5044cd1986180e7e4'

jobs:
  daemon-resource-leak:
    name: daemon / fd-mmap-thread certification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build mono-complete pkg-config

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Configure hardened release
        run: cmake --preset linux-hardened-release

      - name: Build daemon
        run: cmake --build --preset linux-hardened-release --target chronon3d_daemon -j12

      - name: Run resource leak certification
        run: |
          socket_path="${RUNNER_TEMP}/chronon-resource.sock"
          RESOURCE_DAEMON="build/chronon/linux-hardened-release/apps/chronon3d_daemon/chronon3d_daemon --socket ${socket_path} --backend software" \
          RESOURCE_READY="for i in \$(seq 1 100); do test -S '${socket_path}' && exit 0; sleep 0.1; done; exit 1" \
          RESOURCE_WORKLOAD="python3 tools/ipc_resource_workload.py '${socket_path}' --requests 1000" \
          RESOURCE_START_DELAY=0 \
          RESOURCE_OUT="${RUNNER_TEMP}/chronon-resource-artifacts" \
          bash tools/check_resource_leak_gate.sh

      - name: Upload resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronon-resource-leak-evidence
          path: ${{ runner.temp }}/chronon-resource-artifacts
          if-no-files-found: ignore
