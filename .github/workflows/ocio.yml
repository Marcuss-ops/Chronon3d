name: OpenColorIO certification

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
  VCPKG_COMMIT: 'cb2981c4e03d421fa03b9bb5044cd1986180e7e4'

jobs:
  ocio:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build mono-complete pkg-config

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Configure OpenColorIO lane
        run: cmake --preset linux-ocio-certification

      - name: Build OpenColorIO test target
        run: cmake --build --preset linux-ocio-certification -j12

      - name: Run OpenColorIO tests
        run: ctest --preset linux-ocio-certification-test -R '^chronon3d_ocio_tests$' --output-on-failure
