# ═══════════════════════════════════════════════════════════════════════════════
# nightly-sanitizers.yml — P2-A sanitizer schedule
# ═══════════════════════════════════════════════════════════════════════════════
#
# ASan+UBSan also runs on every push to main, so a main commit cannot be
# treated as certified while its sanitizer baseline is stale. TSan remains
# weekly because its runtime and platform sensitivity are substantially higher:
#   ASan+UBSAN → every main push + daily at 02:00 UTC
#   TSan       → weekly, Sunday at 03:00 UTC
#
# Rationale: sanitizers add 2-5× runtime overhead. Running on every push
# delays fast feedback. Nightly/weekly is sufficient to catch regressions.
#
# Unity build is OFF for both sanitizer presets to avoid hiding cross-TU
# data races (unity merges TUs, masking true thread-safety issues).
#
# Manual trigger: workflow_dispatch for debugging.
# ═══════════════════════════════════════════════════════════════════════════════

name: Chronon Sanitizers (main + nightly)

on:
  push:
    branches: [ main ]
  schedule:
    # ASan+UBSAN: daily at 02:00 UTC
    - cron: '0 2 * * *'
    # TSan: weekly, Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      sanitizer:
        description: 'Which sanitizer to run (asan or tsan)'
        required: false
        default: 'asan'
        type: choice
        options:
          - asan
          - tsan
          - both

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
  VCPKG_COMMIT: 'cb2981c4e03d421fa03b9bb5044cd1986180e7e4'

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # ASan + UBSan — runs on main, daily at 02:00 UTC, and on manual dispatch
  # ─────────────────────────────────────────────────────────────────────
  asan-ubsan:
    name: Sanitizer / ASan+UBSAN (main + nightly)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.sanitizer == 'asan' || github.event.inputs.sanitizer == 'both')
      ) || github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Configure (linux-asan, unity OFF)
        run: cmake --preset linux-asan

      - name: Build (chronon3d_cli + chronon3d_tests)
        run: cmake --build --preset linux-asan --target chronon3d_cli chronon3d_tests

      - name: Run tests under ASan+UBSAN
        run: ctest --preset linux-asan-test --output-on-failure

  # ─────────────────────────────────────────────────────────────────────
  # TSan — runs weekly (Sunday 03:00 UTC) and on manual dispatch
  # ─────────────────────────────────────────────────────────────────────
  tsan:
    name: Sanitizer / TSan (weekly)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.sanitizer == 'tsan' || github.event.inputs.sanitizer == 'both')
      || github.event.schedule == '0 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Configure (linux-tsan, unity OFF)
        run: cmake --preset linux-tsan

      - name: Build (chronon3d_cli + chronon3d_tests)
        run: cmake --build --preset linux-tsan --target chronon3d_cli chronon3d_tests

      - name: Run tests under TSan
        run: ctest --preset linux-tsan-test --output-on-failure

  # A separate, unconditional verdict prevents an unselected sanitizer from
  # being mistaken for a PASS.  The required lane is derived from the event:
  # ASan on main/daily-02:00, TSan on weekly-03:00, and the explicit manual
  # selection for workflow_dispatch.
  sanitizer-status:
    name: Sanitizer baseline status (explicit verdict)
    if: ${{ !cancelled() }}
    needs: [asan-ubsan, tsan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the sanitizer lane selected by this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED: ${{ github.event.inputs.sanitizer }}
          ASAN_RESULT: ${{ needs.asan-ubsan.result }}
          TSAN_RESULT: ${{ needs.tsan.result }}
        run: |
          required=""
          if [[ "$EVENT_NAME" == "push" || "$SCHEDULE" == "0 2 * * *" ]]; then
            required="asan"
          elif [[ "$SCHEDULE" == "0 3 * * 0" ]]; then
            required="tsan"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            required="$REQUESTED"
          fi

          case "$required" in
            asan)
              [[ "$ASAN_RESULT" == "success" ]] || {
                echo "GATE_FAIL: ASan/UBSan baseline result=$ASAN_RESULT (not PASS)" >&2
                exit 1
              }
              ;;
            tsan)
              [[ "$TSAN_RESULT" == "success" ]] || {
                echo "GATE_FAIL: TSan baseline result=$TSAN_RESULT (not PASS)" >&2
                exit 1
              }
              ;;
            both)
              [[ "$ASAN_RESULT" == "success" && "$TSAN_RESULT" == "success" ]] || {
                echo "GATE_FAIL: requested both sanitizer lanes: asan=$ASAN_RESULT tsan=$TSAN_RESULT" >&2
                exit 1
              }
              ;;
            *)
              echo "GATE_FAIL: no sanitizer lane selected for event=$EVENT_NAME schedule=$SCHEDULE" >&2
              exit 1
              ;;
          esac
          echo "GATE_PASS: sanitizer baseline=$required (asan=$ASAN_RESULT tsan=$TSAN_RESULT)"
