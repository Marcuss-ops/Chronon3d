name: Developer Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: developer-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  developer-gates:
    name: Canonical developer gate manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run canonical developer gates
        run: bash tools/run_developer_gates.sh origin main
