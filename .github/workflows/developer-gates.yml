name: Developer Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT: 'cb2981c4e03d421fa03b9bb5044cd1986180e7e4'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

concurrency:
  group: developer-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  developer-gates:
    name: Canonical developer gate manifest (FULL)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify same-SHA checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache mono-complete pkg-config

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.10

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Run canonical developer gates (FULL — 13 gates)
        run: bash tools/run_developer_gates.sh --full origin main
