name: CMake cleanup runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cmake-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: chronon3d-cmake-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded CMake cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import sys

          root = Path('.')

          def fail(msg):
              raise SystemExit(f"CMMAKE_CLEANUP_FAIL: {msg}")

          def load_json(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def save_json(path, data):
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding='utf-8')

          obsolete_keys = {
              'CHRONON3D_BUILD_CONTENT',
              'CHRONON3D_BUILD_DIAGNOSTICS',
              'CHRONON3D_ENABLE_VIDRUSH',
          }

          for path in sorted((root / 'cmake/presets').glob('*.json')):
              if path.name == 'vulkan-focused.json':
                  continue
              data = load_json(path)
              changed = False
              for preset in data.get('configurePresets', []):
                  cache = preset.get('cacheVariables')
                  if not isinstance(cache, dict):
                      continue
                  for key in tuple(obsolete_keys):
                      if key in cache:
                          cache.pop(key)
                          changed = True
              if changed:
                  save_json(path, data)

          # Clean stale descriptions/names without breaking preset identifiers.
          p = root / 'cmake/presets/development.json'
          data = load_json(p)
          by_name = {x['name']: x for x in data.get('configurePresets', [])}
          by_name['linux-ci-core-gate']['displayName'] = 'Linux CI Core Gate'
          by_name['linux-ci-core-gate']['description'] = 'Pre-merge core gate: tests on, text/video off. Diagnostics and verification follow the canonical test policy.'
          by_name['linux-ci-lean-gate']['displayName'] = 'Linux CI Lean Gate'
          by_name['linux-ci-lean-gate']['description'] = 'Pre-merge lean gate: CLI + text + Blend2D + tests, with video and benchmarks disabled. Diagnostics and verification follow the canonical test policy.'
          by_name['linux-asan']['description'] = 'AddressSanitizer + UndefinedBehaviorSanitizer debug preset with tests, CLI, text and Blend2D enabled. Diagnostics are enabled by the canonical test policy.'
          by_name['linux-tsan']['description'] = 'ThreadSanitizer debug preset with tests, CLI, text and Blend2D enabled. Diagnostics are enabled by the canonical test policy.'
          by_name['linux-dev']['description'] = 'Daily developer preset: CLI + telemetry + tests, Debug build, unity enabled. Bundled compositions are external.'
          by_name['linux-content-dev']['displayName'] = 'Linux Video Dev (legacy preset name)'
          by_name['linux-content-dev']['description'] = 'Video development preset retained under the historical linux-content-dev name for compatibility. Bundled compositions are external.'
          save_json(p, data)

          p = root / 'cmake/presets/fast-variants.json'
          data = load_json(p)
          by_name = {x['name']: x for x in data.get('configurePresets', [])}
          by_name['linux-turbo']['description'] = 'Minimal Debug CLI preset used by build-fast.sh turbo and turbo-inc; tests and video are disabled.'
          by_name['linux-fast-dev-release']['description'] = 'RelWithDebInfo incremental CLI + test build used by build-fast.sh release.'
          save_json(p, data)

          p = root / 'cmake/presets/linux-fast-dev.json'
          data = load_json(p)
          data['configurePresets'][0]['description'] = 'Daily inner-loop preset consumed by build-fast.sh: CLI + tests + text + Blend2D, with video and benchmarks disabled.'
          save_json(p, data)

          p = root / 'cmake/presets/linux-video-fast-dev.json'
          data = load_json(p)
          data['configurePresets'][0]['description'] = 'GPU/video inner loop: Vulkan, CUDA interop, native FFmpeg, text and CLI; tests and benchmarks disabled.'
          save_json(p, data)

          p = root / 'cmake/presets/profiling.json'
          data = load_json(p)
          profile_desc = {
              'linux-profile-core': 'Hidden core-only profile matrix preset used by the nightly profile-envelope workflow.',
              'linux-profile-motion': 'Hidden profile matrix preset with Blend2D and text enabled.',
              'linux-profile-video': 'Hidden profile matrix preset with native FFmpeg, telemetry, Blend2D and text enabled.',
              'linux-profile-extended': 'Hidden extended feature envelope with mesh, EXR, telemetry, benchmarks and tracing enabled.',
          }
          for preset in data.get('configurePresets', []):
              if preset['name'] in profile_desc:
                  preset['description'] = profile_desc[preset['name']]
          save_json(p, data)

          p = root / 'cmake/presets/optimizations.json'
          data = load_json(p)
          opt_desc = {
              '__release-pgo-base': 'Shared hidden base for PGO, ThinLTO and BOLT release optimization. Floating-point contraction remains disabled by the root build contract.',
              'release-pgo': 'PGO profile-use build. Requires a pre-collected merged.profdata at the configured profile path.',
              'release-thinlto': 'ThinLTO release build without profile collection.',
              'release-pgo-thinlto': 'Combined PGO profile-use and ThinLTO release build. Requires a pre-collected merged.profdata.',
              'release-pgo-thinlto-bolt': 'Combined PGO, ThinLTO and BOLT release build. Requires merged.profdata plus BOLT perf.fdata.',
          }
          for preset in data.get('configurePresets', []):
              if preset['name'] in opt_desc:
                  preset['description'] = opt_desc[preset['name']]
          save_json(p, data)

          p = root / 'cmake/presets/ci.json'
          data = load_json(p)
          by_name = {x['name']: x for x in data.get('configurePresets', [])}
          by_name['linux-ci']['description'] = 'Daily CI for the engine core: CLI + tests + install consumer, with bundled compositions external.'
          by_name['linux-ci-nocontent']['displayName'] = 'Linux CI core (compatibility alias)'
          save_json(p, data)

          # Repair the CFI lane: its build preset targets chronon3d_daemon, so IPC + daemon must be enabled.
          p = root / 'cmake/presets/hardening.json'
          data = load_json(p)
          by_name = {x['name']: x for x in data.get('configurePresets', [])}
          cfi = by_name.get('linux-cfi')
          if cfi is None:
              fail('linux-cfi preset missing')
          cfi.setdefault('cacheVariables', {})['CHRONON3D_ENABLE_IPC'] = 'ON'
          cfi['cacheVariables']['CHRONON3D_BUILD_DAEMON'] = 'ON'
          cfi['description'] = 'Clang-only CFI lane for the persistent IPC daemon; requires LTO, IPC and daemon support.'
          save_json(p, data)

          # Restore the Windows aliases consumed by ci.yml instead of leaving a dead matrix entry.
          windows = {
              'version': 6,
              'include': ['base.json'],
              'configurePresets': [{
                  'name': 'win-release',
                  'inherits': 'base',
                  'condition': {'type': 'equals', 'lhs': '${hostSystemName}', 'rhs': 'Windows'},
                  'displayName': 'Windows Release CI',
                  'description': 'Windows release CI preset matching the win/win-test aliases consumed by .github/workflows/ci.yml.',
                  'cacheVariables': {
                      'CMAKE_BUILD_TYPE': 'Release',
                      'VCPKG_TARGET_TRIPLET': 'x64-windows',
                      'CHRONON3D_BUILD_CLI': 'ON',
                      'CHRONON3D_BUILD_TESTS': 'ON',
                      'CHRONON3D_ENABLE_IPC': 'ON',
                      'CHRONON3D_ENABLE_VERIFICATION': 'ON',
                      'VCPKG_MANIFEST_FEATURES': 'tests;ipc',
                  },
              }],
              'buildPresets': [{'name': 'win', 'configurePreset': 'win-release', 'jobs': 8}],
              'testPresets': [{'name': 'win-test', 'configurePreset': 'win-release', 'output': {'outputOnFailure': True}}],
          }
          save_json(root / 'cmake/presets/windows.json', windows)

          p = root / 'CMakePresets.json'
          data = load_json(p)
          data.setdefault('cmakeMinimumRequired', {})['major'] = 3
          data['cmakeMinimumRequired']['minor'] = 27
          data['cmakeMinimumRequired']['patch'] = 0
          includes = data.setdefault('include', [])
          windows_include = 'cmake/presets/windows.json'
          if windows_include not in includes:
              includes.append(windows_include)
          save_json(p, data)

          # Empty, unreferenced preset is demolition debt, not a feature.
          stale = root / 'cmake/presets/vulkan-focused.json'
          if stale.exists():
              if stale.read_text(encoding='utf-8').strip():
                  fail('vulkan-focused.json is no longer empty; refusing to delete concurrent work')
              stale.unlink()

          # Root CMake: canonical platform FP flags, no Unix linker probing on MSVC, and real BOLT wiring.
          p = root / 'CMakeLists.txt'
          text = p.read_text(encoding='utf-8')
          old = 'add_compile_options(-ffp-contract=off)'
          new = '''if(MSVC)\n    add_compile_options(/fp:strict)\nelseif(CMAKE_CXX_COMPILER_ID MATCHES "GNU|Clang")\n    add_compile_options(-ffp-contract=off)\nendif()'''
          if old not in text and new not in text:
              fail('root floating-point flag anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('if(NOT CMAKE_CXX_LINKER_LAUNCHER)', 'if(NOT CMAKE_CXX_LINKER_LAUNCHER AND NOT MSVC)', 1)
          text = text.replace('--preset linux-release', '--preset linux-fast-dev')
          if 'option(CHRONON3D_BOLT_POSTPROCESS' not in text:
              anchor = '''option(CHRONON3D_BUILD_TIME_TRACE\n       "Emit Clang -ftime-trace JSON files for compile-time profiling" OFF)\n'''
              if anchor not in text:
                  fail('BOLT option insertion anchor missing')
              text = text.replace(anchor, anchor + 'option(CHRONON3D_BOLT_POSTPROCESS\n       "Enable LLVM BOLT post-link optimization targets" OFF)\n', 1)
          if 'include(${CMAKE_SOURCE_DIR}/cmake/bolt_postprocess.cmake)' not in text:
              anchor = '''if(CHRONON3D_BUILD_BENCHMARKS)\n    add_subdirectory(apps/chronon3d_bench)\nendif()\n'''
              if anchor not in text:
                  fail('BOLT include insertion anchor missing')
              text = text.replace(anchor, anchor + '''\nif(CHRONON3D_BOLT_POSTPROCESS)\n    include(${CMAKE_SOURCE_DIR}/cmake/bolt_postprocess.cmake)\nendif()\n''', 1)
          p.write_text(text, encoding='utf-8')

          # BOLT applies to an ELF executable; never feed the static SDK archive to llvm-bolt.
          (root / 'cmake/bolt_postprocess.cmake').write_text('''# Canonical BOLT post-link target for the release-pgo-thinlto-bolt preset.\nfind_program(LLVM_BOLT_EXECUTABLE NAMES llvm-bolt bolt)\nif(NOT LLVM_BOLT_EXECUTABLE)\n    message(FATAL_ERROR\n        "CHRONON3D_BOLT_POSTPROCESS requires llvm-bolt on PATH. "\n        "Use release-pgo-thinlto when BOLT is unavailable.")\nendif()\n\nif(NOT TARGET chronon3d_cli)\n    message(FATAL_ERROR "CHRONON3D_BOLT_POSTPROCESS requires CHRONON3D_BUILD_CLI=ON")\nendif()\nif(NOT CHRONON3D_BOLT_DATA_PATH)\n    message(FATAL_ERROR "CHRONON3D_BOLT_DATA_PATH must point to a perf2bolt .fdata file")\nendif()\n\nadd_custom_target(bolt-postprocess\n    COMMAND ${LLVM_BOLT_EXECUTABLE}\n            $<TARGET_FILE:chronon3d_cli>\n            -data ${CHRONON3D_BOLT_DATA_PATH}\n            -o $<TARGET_FILE:chronon3d_cli>.bolt\n            -relocs\n    DEPENDS chronon3d_cli\n    COMMENT "BOLT post-link optimization for chronon3d_cli"\n    VERBATIM\n)\n''', encoding='utf-8')

          # Canary catalog: remove the retired content authority and point diagnostics at its real gated OBJECT target.
          (root / 'cmake/Chronon3DCanarySymbols.cmake').write_text('''# Canonical SDK archive canaries: AREA|SYMBOL|GUARD|TARGET.\n# Guards must name real root CMake options; retired compatibility flags are forbidden.\nset(CHRONON3D_SDK_CANARY_SYMBOLS\n    "core|chronon3d::detail::parse_proc_stat|always|chronon3d_core_impl"\n    "animations|chronon3d::temporal::generate_temporal_samples|always|chronon3d_animations"\n    "scene|chronon3d::camera_v1::register_camera_v1_builtins|always|chronon3d_scene"\n    "runtime|chronon3d::RenderSession::arena|always|chronon3d_runtime"\n    "graph|chronon3d::graph::register_pipeline_graph_nodes|always|chronon3d_graph_pipeline"\n    "software_backend|chronon3d::SoftwareRenderer::buffer_ring|always|chronon3d_backend_software"\n    "text_core|chronon3d::build_text_run|CHRONON3D_ENABLE_TEXT|chronon3d_text_core"\n    "diagnostics|chronon3d::renderer::diagnostics::draw_bbox_overlay|CHRONON3D_ENABLE_DIAGNOSTICS|chronon3d_backend_software_diagnostics"\n    "sdk|chronon3d::sdk::RenderEngine|always|chronon3d_runtime"\n    "ar_race|arch:ar_t_post_nm_non_empty|always|chronon3d_sdk_impl"\n)\n''', encoding='utf-8')

          (root / 'tools/sdk/check_archive_canaries.sh').write_text(r'''#!/usr/bin/env bash
set -euo pipefail

HERE="$(cd "$(dirname "$0")" && pwd)"
# shellcheck source=./common.sh
source "$HERE/common.sh"

: "${SDK_PREFIX:?SDK_PREFIX env var required}"
: "${SDK_BUILD:?SDK_BUILD env var required}"
: "${REPO_ROOT:?REPO_ROOT env var required}"

impl_archive="$(find "$SDK_PREFIX" -type f -name 'libchronon3d_sdk_impl.a' 2>/dev/null | head -1 || true)"
[[ -n "$impl_archive" ]] || fail "libchronon3d_sdk_impl.a not found in $SDK_PREFIX"
[[ -d "$SDK_PREFIX/include/chronon3d" ]] || fail "public headers missing from $SDK_PREFIX/include/chronon3d"
find "$SDK_PREFIX/include/chronon3d" -type f -name '*.hpp' -print -quit | grep -q . \
    || fail "no installed public headers found"

text_on="$(cache_var CHRONON3D_ENABLE_TEXT)"; : "${text_on:=ON}"
diag_on="$(cache_var CHRONON3D_ENABLE_DIAGNOSTICS)"; : "${diag_on:=OFF}"
log "canary guards: text=$text_on diagnostics=$diag_on"

canary_file="$REPO_ROOT/cmake/Chronon3DCanarySymbols.cmake"
[[ -f "$canary_file" ]] || fail "canary catalog not found: $canary_file"
canary_entries="$(grep -oE '"[a-z_]+\|[a-zA-Z0-9_:]+\|[a-zA-Z0-9_]+\|[a-zA-Z0-9_]+"' "$canary_file" || true)"
[[ -n "$canary_entries" ]] || fail "no canonical canary entries parsed from $canary_file"

GATE_TMP="$(mktemp_dir chronon3d_install_gate)"
cleanup_register "$GATE_TMP"
ar_before="$GATE_TMP/ar_before.txt"
ar_after="$GATE_TMP/ar_after.txt"
nm_dump="$GATE_TMP/nm.txt"

ar t "$impl_archive" > "$ar_before" || fail "ar t failed on $impl_archive"
ar_count="$(wc -l < "$ar_before" | tr -d ' ')"
(( ar_count >= 2 )) || fail "SDK archive contains only $ar_count object(s)"
nm -C "$impl_archive" > "$nm_dump" || fail "nm -C failed on $impl_archive"
ar t "$impl_archive" > "$ar_after" || fail "post-nm ar t failed on $impl_archive"
ar_count_after="$(wc -l < "$ar_after" | tr -d ' ')"
(( ar_count_after >= 1 )) || fail "post-nm SDK archive listing is empty"
if (( ar_count_after != ar_count )); then
    log "WARN: SDK archive object count drifted across nm: before=$ar_count after=$ar_count_after"
fi

checked=0
skipped=0
missing=0
fail_list=""
while IFS= read -r entry; do
    body="${entry#\"}"; body="${body%\"}"
    IFS='|' read -r area symbol guard target <<<"$body"
    skip_reason=""
    case "$guard" in
        always) : ;;
        CHRONON3D_ENABLE_TEXT)
            [[ "$text_on" == "ON" ]] || skip_reason="CHRONON3D_ENABLE_TEXT=$text_on"
            ;;
        CHRONON3D_ENABLE_DIAGNOSTICS)
            [[ "$diag_on" == "ON" ]] || skip_reason="CHRONON3D_ENABLE_DIAGNOSTICS=$diag_on"
            ;;
        *) fail "unknown canary guard '$guard' for '$area'" ;;
    esac
    if [[ -n "$skip_reason" ]]; then
        log "SKIP: canary $area [$target] ($skip_reason)"
        skipped=$((skipped + 1))
        continue
    fi

    if [[ "$symbol" == "arch:ar_t_post_nm_non_empty" ]]; then
        log "OK: structural canary $area [$target]"
        checked=$((checked + 1))
    elif grep -F -q -- "$symbol" "$nm_dump"; then
        log "OK: canary $area [$target] :: $symbol"
        checked=$((checked + 1))
    else
        log "FAIL: canary $area [$target] :: '$symbol' missing"
        missing=$((missing + 1))
        fail_list="${fail_list}${fail_list:+, }$area"
    fi
done <<<"$canary_entries"

(( missing == 0 )) || fail "$missing SDK canary symbol(s) missing: $fail_list"
log "Canary gate: $checked present, $skipped skipped, 0 missing"
''', encoding='utf-8')

          (root / 'tools/sdk/check_feature_ghosts.sh').write_text(r'''#!/usr/bin/env bash
set -euo pipefail

HERE="$(cd "$(dirname "$0")" && pwd)"
# shellcheck source=./common.sh
source "$HERE/common.sh"

: "${SDK_PREFIX:?SDK_PREFIX env var required}"
: "${SDK_BUILD:?SDK_BUILD env var required}"
: "${REPO_ROOT:?REPO_ROOT env var required}"
: "${PRESET:?PRESET env var required}"

log "diagnostics ghost sweep starting (tests=OFF, diagnostics=OFF)"
cmake -S "$REPO_ROOT" -B "$SDK_BUILD" --preset "$PRESET" \
    -DCMAKE_INSTALL_PREFIX="$SDK_PREFIX" \
    -DCHRONON3D_BUILD_TESTS=OFF \
    -DCHRONON3D_ENABLE_DIAGNOSTICS=OFF 1>&2 \
    || fail "diagnostics ghost sweep reconfigure failed"
cmake --build "$SDK_BUILD" --target chronon3d_sdk_impl -j8 1>&2 \
    || fail "diagnostics ghost sweep SDK rebuild failed"
cmake --install "$SDK_BUILD" --prefix "$SDK_PREFIX" 1>&2 \
    || fail "diagnostics ghost sweep install failed"

impl_archive="$(find "$SDK_PREFIX" -type f -name 'libchronon3d_sdk_impl.a' 2>/dev/null | head -1 || true)"
[[ -n "$impl_archive" ]] || fail "SDK archive missing after diagnostics-OFF rebuild"
GATE_TMP="$(mktemp_dir chronon3d_install_gate_off)"
cleanup_register "$GATE_TMP"
nm_dump="$GATE_TMP/nm_off.txt"
nm -C "$impl_archive" > "$nm_dump" || fail "nm -C failed on diagnostics-OFF archive"

symbol='chronon3d::renderer::diagnostics::draw_bbox_overlay'
if grep -F -q -- "$symbol" "$nm_dump"; then
    fail "GHOST-FAIL: diagnostics symbol leaked into CHRONON3D_ENABLE_DIAGNOSTICS=OFF archive: $symbol"
fi
log "GHOST-OK: diagnostics-OFF archive contains no diagnostics overlay symbol"
''', encoding='utf-8')

          # Remove the duplicated installed C ABI alias block; keep the documented block after SDK alias creation.
          p = root / 'cmake/Chronon3DConfig.cmake.in'
          text = p.read_text(encoding='utf-8')
          duplicate = '''# The C ABI target is exported with the short internal name `C` for\n# compatibility with the existing target file.  Re-expose it through the\n# namespaced public spelling used by installed C consumers.\nif(TARGET C AND NOT TARGET Chronon3D::C)\n    add_library(Chronon3D::C ALIAS C)\nendif()\n\n'''
          count = text.count('add_library(Chronon3D::C ALIAS C)')
          if count == 2:
              if duplicate not in text:
                  fail('C ABI duplicate alias block shape changed')
              text = text.replace(duplicate, '', 1)
          elif count != 1:
              fail(f'unexpected Chronon3D::C alias count: {count}')
          p.write_text(text, encoding='utf-8')

          # Remove duplicated explanatory paragraph from the archive guard, preserving behavior.
          p = root / 'cmake/Chronon3DSdkArchive.cmake'
          text = p.read_text(encoding='utf-8')
          paragraph = '''    # TICKET-SDK-PACKAGING-CONSOLIDATION — build the diagnostic body in a\n    # single multi-line string and emit ONE message(FATAL_ERROR ...).\n    # An earlier revision used a `foreach(); message(FATAL_ERROR); endforeach()`\n    # pattern which the cmake runtime halts after the first iteration, so\n    # only the first archive path was reported.  Aggregating the body in a\n    # string ensures every offender is enumerated before cmake exits.\n'''
          if text.count(paragraph) >= 2:
              text = text.replace(paragraph + paragraph, paragraph, 1)
          p.write_text(text, encoding='utf-8')

          # Final stale-authority scan for the surfaces owned by this cleanup.
          scan_paths = [root / 'cmake/presets', root / 'cmake/Chronon3DCanarySymbols.cmake', root / 'tools/sdk/check_archive_canaries.sh', root / 'tools/sdk/check_feature_ghosts.sh']
          for target in scan_paths:
              files = target.rglob('*') if target.is_dir() else [target]
              for f in files:
                  if not f.is_file():
                      continue
                  body = f.read_text(encoding='utf-8', errors='ignore')
                  for key in obsolete_keys:
                      if key in body:
                          fail(f'obsolete authority {key} remains in {f}')
          PY

      - name: Validate configuration surfaces
        shell: bash
        run: |
          set -euo pipefail
          test ! -e cmake/presets/vulkan-focused.json
          for f in CMakePresets.json cmake/presets/*.json; do
            python3 -m json.tool "$f" >/dev/null
          done
          cmake --list-presets > /tmp/chronon-presets.txt
          grep -q 'win-release' /tmp/chronon-presets.txt
          grep -q 'release-pgo-thinlto-bolt' /tmp/chronon-presets.txt
          grep -q 'include(${CMAKE_SOURCE_DIR}/cmake/bolt_postprocess.cmake)' CMakeLists.txt
          grep -q 'CHRONON3D_ENABLE_IPC' cmake/presets/hardening.json
          grep -q 'CHRONON3D_BUILD_DAEMON' cmake/presets/hardening.json
          bash -n tools/sdk/check_archive_canaries.sh
          bash -n tools/sdk/check_feature_ghosts.sh
          python3 tools/check_architecture.py

      - name: Commit, rebase and push through canonical wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Chronon3D Agent"
          git config user.email "chronon3d-agent@users.noreply.github.com"
          git config branch.main.rebase true
          git branch --set-upstream-to=origin/main main
          rm -f .github/workflows/cmake-cleanup.yml
          git add -A
          git diff --cached --check
          git commit -m "build(cmake): remove stale configuration authorities"
          git fetch origin main
          git rebase origin/main
          export CHRONON3D_TESTED_SHA="$(git rev-parse HEAD)"
          bash tools/wrap_push.sh origin main
          git log -n 5 --oneline
