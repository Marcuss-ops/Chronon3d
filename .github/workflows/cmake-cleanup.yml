name: CMake cleanup runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cmake-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: chronon3d-cmake-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded CMake cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/cmake_cleanup_patch.py tools/cmake_cleanup_finalize.py
          python3 tools/cmake_cleanup_patch.py
          python3 tools/cmake_cleanup_finalize.py

      - name: Validate configuration surfaces
        shell: bash
        run: |
          set -euo pipefail
          test ! -e cmake/presets/vulkan-focused.json
          for f in CMakePresets.json cmake/presets/*.json; do
            python3 -m json.tool "$f" >/dev/null
          done
          python3 -c "import json; d=json.load(open('cmake/presets/windows.json')); assert any(x.get('name')=='win-release' for x in d.get('configurePresets',[])); assert any(x.get('name')=='win' for x in d.get('buildPresets',[])); assert any(x.get('name')=='win-test' for x in d.get('testPresets',[]))"
          cmake --list-presets > /tmp/chronon-presets.txt
          grep -q 'release-pgo-thinlto-bolt' /tmp/chronon-presets.txt
          grep -Fq 'include(${CMAKE_SOURCE_DIR}/cmake/bolt_postprocess.cmake)' CMakeLists.txt
          grep -q 'CHRONON3D_ENABLE_IPC' cmake/presets/hardening.json
          grep -q 'CHRONON3D_BUILD_DAEMON' cmake/presets/hardening.json
          bash -n tools/sdk/check_archive_canaries.sh
          bash -n tools/sdk/check_feature_ghosts.sh
          grep -Fq 'chronon3d::renderer::diagnostics::draw_bbox_overlay|CHRONON3D_ENABLE_DIAGNOSTICS|chronon3d_backend_software_diagnostics' cmake/Chronon3DCanarySymbols.cmake
          if grep -R -n -E 'CHRONON3D_BUILD_CONTENT|CHRONON3D_BUILD_DIAGNOSTICS|CHRONON3D_ENABLE_VIDRUSH' cmake/presets cmake/Chronon3DCanarySymbols.cmake tools/sdk/check_archive_canaries.sh tools/sdk/check_feature_ghosts.sh; then
            echo 'obsolete CMake authority remains' >&2
            exit 1
          fi
          git diff --check

      - name: Remove temporary helpers and run architecture gate
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/cmake_cleanup_patch.py tools/cmake_cleanup_finalize.py .github/workflows/cmake-cleanup.yml
          python3 tools/check_architecture.py
          git diff --check

      - name: Commit and push through canonical wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Chronon3D Agent"
          git config user.email "chronon3d-agent@users.noreply.github.com"
          git config branch.main.rebase true
          git branch --set-upstream-to=origin/main main
          git add -A
          git diff --cached --check
          git commit -m "build(cmake): remove stale configuration authorities"
          git fetch origin main
          git rebase origin/main
          export CHRONON3D_TESTED_SHA="$(git rev-parse HEAD)"
          bash tools/wrap_push.sh origin main
          git log -n 5 --oneline
