# Repository-wide handwritten .inc debt ratchet.
#
# Baseline 2026-09-04:
#   src/     = 0 handwritten .inc
#   include/ = 0 handwritten .inc
#   apps/    = 16 handwritten .inc
# Current production debt after the CPU migration:
#   apps/ = 0, src/ = 0, include/ = 0. CUDA lab fragments under tools/hwlab/
# are intentionally outside this production rule and require hardware.
#
# The permanent end state is that handwritten .inc files are allowed only below
# generated/ directories in the scanned production trees.

[[occurrence_cap]]
name = "handwritten_inc_debt_ratchet"
pattern = '\A'
max_count = 0
scan_paths = ["src", "apps", "include"]
extensions = [".inc"]
allow_list = [
  '(^|/)generated/',
]
skip_comments = false
