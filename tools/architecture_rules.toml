# -----------------------------------------------------------------------------
# scan_path existence policy
#
# A rule that scans a path which no longer exists can never fail, so its
# silence is indistinguishable from a pass. `scan_path_existence` (enforced by
# tools/check_architecture.py) hard-fails every declared scan_path that does
# not resolve, unless it matches one of the globs below. Project content packs
# live outside the core checkout, so those trees are the only declared
# exceptions; anything else must be repointed or the dead rule removed.
# -----------------------------------------------------------------------------
[scan_path_policy]
name = "scan_path_existence"
description = "Every declared scan_path (and every contract/loc_bound file target) must resolve, or be listed in optional_globs."
# Paths legitimately absent from a core checkout. `content` and `examples` are
# shipped by the external content pack, so every rule that scans them is a
# no-op here BY DECLARATION — its green is not evidence until the lane that
# materializes them runs (AUDIT P2-5). The lane is:
#   `CHRONON3D_BUILD_CONTENT=ON` + the content pack (see docs/evidence/ and
#   TICKET-MAIN-TRUTH-STAGE-1-2 for the corpus precondition).
optional_globs = [
  "content",
  "examples",
]

[[duplicate_basename]]
name = "duplicate_source_basenames"
description = "Prevent new source basename collisions and namespace/directory drift; historical collisions require explicit grandfathering."
scan_paths = ["include/chronon3d", "src", "tests", "apps"]
extensions = [".h", ".hpp", ".hh", ".c", ".cc", ".cpp", ".cxx", ".inc"]
allowlist = "tools/duplicate_basename_allowlist.txt"
hint = "Use the canonical owner directory; if a compatibility boundary truly needs a duplicate basename, add a reviewed grandfather entry and explain the demolition scope in its ticket."

[[required_path]]
name = "canonical_error_model_header"
paths = ["include/chronon3d/core/types/error.hpp"]

[[contract]]
name = "canonical_error_model_contract"
file = "include/chronon3d/core/types/error.hpp"
required_patterns = [
  "enum class ErrorCategory",
  "struct ErrorDetail",
  "struct Error",
  "kLegacyErrorMappings",
  "from_legacy",
  "is_registered_legacy_type",
]

[[presence]]
name = "canonical_error_legacy_mapping_inventory"
scan_paths = ["include/chronon3d/core/types/error.hpp"]
pattern = "\\{\\\"chronon3d::"
min_matches = 27

[[scan]]
name = "canonical_error_construction_gate"
scan_paths = ["include", "src", "apps", "tests"]
allow_list = [
  "include/chronon3d/core/error.hpp",
  "include/chronon3d/core/types/error.hpp",
]
patterns = [
  "\\bchronon::Error\\s*\\{",
  "\\bchronon3d::Error\\s*\\{",
]
skip_comments = true

[[scan]]
name = "silent_catch_continue_forbidden"
scan_paths = ["include", "src", "apps"]
patterns = ["catch\\s*\\(\\s*\\.\\.\\.\\s*\\)\\s*\\{(?:(?!\\}).){0,600}\\bcontinue\\s*;"]
multiline = true
skip_comments = true

[[forbidden_symbol]]
name = "text_selector_evaluator_authority"
description = "Selector semantics have one compiled authority; callers use selector_weight()."
patterns = ['\bevaluate_compiled_selector\s*\(']
scan_paths = ["include", "src", "apps", "tests"]
allow_list = [
  "include/chronon3d/text/glyph_selector.hpp",
  "src/text/glyph_selector_compile.cpp",
]
skip_comments = true
hint = "Use selector_weight(); do not call the legacy evaluator outside glyph_selector_compile.cpp."

[[forbidden_symbol]]
name = "text_selector_shape_math_authority"
description = "Smooth and selector-shape mathematics live in glyph_selector_compile.cpp."
patterns = ['\bevaluate_selector_shape\s*\(']
scan_paths = ["include", "src", "apps", "tests"]
allow_list = [
  "include/chronon3d/text/glyph_selector.hpp",
  "src/text/glyph_selector_compile.cpp",
  "tests/text/test_selector_shapes.cpp",
]
skip_comments = true
hint = "Do not duplicate selector shape/Smooth mathematics in another runtime TU."

[[scan]]
name = "render_error_taxonomy_consolidated"
scan_paths = ["include", "src", "apps", "tests"]
patterns = ["namespace\\s+chronon3d::render\\s*\\{(?:(?!\\}).){0,1200}enum\\s+class\\s+RenderErrorCode"]
multiline = true
skip_comments = true

# ── The error-adapter rules project the inventory, they do not duplicate it ──
# AUDIT F18 — kLegacyErrorMappings is the single inventory of legacy error
# enums; the 18 `<stem>_error_construction_adapter_only` scan rules below are a
# projection of it. This table names the authority and lets the engine prove the
# projection is faithful (every adapter rule resolves to a registered legacy
# type, and the declared array arity matches the rows on disk), so neither side
# can silently drift into a second source of truth.
# ── Gate exemptions are declared data, not script-local literals ────────────
# AUDIT F20 — check_doc_sha_dedup.sh used to carry its exemption arrays in the
# script, so a decision documented in TICKET-FOLLOWUP-DE-DUP-REFERENCES had its
# only executable record inside the gate. The data file is now declared here so
# the registry fails if it disappears or is renamed out from under the gate.
[[required_path]]
name = "doc_sha_dedup_exemptions"
description = "Single audit trail for the doc-sha dedup gate exemptions."
paths = ["tools/gates/doc_sha_dedup_exemptions.txt"]

[error_adapter_inventory]
name = "error_adapter_inventory_coverage"
description = "Adapter-construction rules must project kLegacyErrorMappings."
header = "include/chronon3d/core/types/error.hpp"
# Adapter guards for error types that are intentionally NOT legacy-mapping rows:
# they are typed Result payloads whose construction is already owned by one
# header, not `from_legacy` registrations.  Naming them here keeps the
# exemption visible instead of letting the rule silently outlive its subject.
foreign_adapter_types = [
  "chronon3d::CameraEvaluationError",
]

