# ── Cache taxonomy is enforced, not merely documented ────────────────────────
# include/chronon3d/cache/cache_taxonomy.hpp names the three families and the
# single primitive; AGENTS.md repeats the table. These rules give the taxonomy
# teeth, so that compiled GPU program artifacts (SPIR-V, Slang output, PTX
# module, CUBIN, SASS specialization, CUDA graph executable) arrive as
# ProgramCache content instead of as a new family or a second cache engine.

[[scan]]
name = "no_gpu_binary_cache_family"
description = "A GPU program/binary artifact store must be ProgramCache content, not a new cache family or registry named after its lowering (no SlangCache / PtxCache / SassCache / ShaderBinaryRegistry)."
scan_paths = ["include", "src", "apps"]
patterns = [
  '\b(class|struct)\s+\w*(Slang|Ptx|Sass|Spirv|SpirV|ShaderBinary|KernelBinary|Cubin|CudaGraph)\w*(Cache|Registry|Store|Repository)\b',
]
skip_comments = true
hint = "Register the artifact kind in cache::ProgramCache (include/chronon3d/cache/cache_taxonomy.hpp) and key it on the canonical program fingerprint. A lowering is compiler technology, not a renderer/backend/cache."

[[scan]]
name = "single_cache_primitive"
description = "LruCache is the only generic cache engine (AGENTS.md: 'Nessuna seconda cache engine'); a second engine or a parallel LRU must be refused, not merged later."
scan_paths = ["include", "src", "apps"]
allow_list = ["include/chronon3d/cache/lru_cache.hpp"]
patterns = [
  '\b(class|struct)\s+\w*(CacheEngine|CacheStore|LruCache|LruStore)\w*\b',
]
skip_comments = true
hint = "Delegate storage/eviction to include/chronon3d/cache/lru_cache.hpp. Specialized residency managers may own allocation, but they are not a second generic primitive."

# ── The C ABI contract must compile in a default CI lane ─────────────
# CHRONON3D_BUILD_C_API defaults to OFF in CMakeLists.txt, and the only CMake
# file that creates the chronon3d_c target is cmake/Chronon3DSdkTargets.cmake
# inside that `if()`. Leaving the option off in the SDK-distribution preset
# means the whole C ABI v0.2 surface (chronon3d.h, the .inc fragments,
# SOVERSION 2) is compiled in no default lane — the `linux-ci` preset is the
# one CI Gate 4 configures, builds `chronon3d_c` from and installs, and
# tests/install_consumer/CMakeLists.txt hard-requires the exported target.
[[presence]]
name = "c_api_builds_in_default_ci_lane"
description = "The `linux-ci` preset (SDK-distribution lane) must enable CHRONON3D_BUILD_C_API so the C ABI compiles on a default CI run (AUDIT F2)."
scan_paths = ["cmake/presets/ci.json"]
extensions = [".json"]
pattern = '(?s)"name":\s*"linux-ci",(?:(?!"name":).)*?"CHRONON3D_BUILD_C_API":\s*"ON"'
min_matches = 1
skip_comments = false
hint = "Set \"CHRONON3D_BUILD_C_API\": \"ON\" in the linux-ci preset, or move the SDK-distribution lane to a preset that does."

# ── Demolition-debt counters must have a reader ──────────────────────
# AGENTS.md requires every compatibility path to declare an observable exit
# condition. A counter that is written but snapshot by nothing is a dead
# lighthouse: the branch it measures can never be proven removable, so it
# survives forever. This rule keeps those counters wired to the canonical
# telemetry snapshot surface (apps/chronon3d_cli/utils/telemetry/
# telemetry_capture.hpp), which feeds reports and the corpus gates.
[[presence]]
name = "demolition_debt_counters_are_observable"
description = "TICKET-GPU-TEXT-CPU-SELECTOR-COMPAT counters must be readable from the canonical telemetry snapshot (AUDIT F1); remove the rule together with the branch when the exit condition is met."
scan_paths = ["apps/chronon3d_cli/utils/telemetry/telemetry_capture.hpp"]
pattern = "gpu_text_cpu_selector_compat_(?:frames|glyph_evals)"
min_matches = 2
skip_comments = true
hint = "Snapshot the counter in capture_counters() (or delete both the counter and the compatibility branch it measures)."

[[contract]]
name = "cache_taxonomy_gpu_artifact_doctrine"
description = "The ProgramCache family must keep naming every compiled GPU artifact kind and the canonical key rule it is keyed on."
file = "include/chronon3d/cache/cache_taxonomy.hpp"
required_patterns = [
  "SPIR-V",
  "Slang",
  "PTX",
  "SASS",
  "CUDA graph executable",
  "compute_render_job_fingerprint",
]

# ── Operative docs must reference tools/ paths that exist ──────────────────────
# A runbook command that fails on invocation still reads like certification.
# docs/GOVERNANCE.md prescribed `tools/check_architecture_boundaries.sh` long
# after it had been consolidated into check_architecture.py, and
# docs/CURRENT_STATUS.md advertised a WBH toolchain contract for two scripts
# that were never written: both are caught here.
#
# Excluded by pattern: dated audit records (immutable history, they quote paths
# as they were) and forward-looking plans (they name tooling not yet written).
[[doc_tool_reference]]
name = "doc_tool_references_resolve"
description = "Operative docs (AGENTS.md, README.md, docs/**) must only reference tools/ paths that exist in the tree."
doc_paths = ["AGENTS.md", "README.md", "docs"]
extensions = [".md"]
pattern = "\\btools/[A-Za-z0-9_][A-Za-z0-9_./-]*"
exclude_paths = [
  "^docs/(AUDIT-|CCACHE-AUDIT-)",
  "^docs/(adr|baselines|tickets|archive)/",
  "^docs/ROADMAP\\.md$",
]
allow_missing = []
