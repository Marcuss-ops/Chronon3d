# ═══════════════════════════════════════════════════════════════════════════
# architecture_rules_wave9.toml — Phase 9 (CLI/IPC parity) enforcement.
#
# After the typed-dispatcher migration the transport cannot reintroduce a
# JSON re-forward, a second payload parse, or a second normalize step. These
# rules make each reintroduction a GATE FAIL, not a review comment:
#   * a JSON re-forward marker (`forward_payload`) is a forbidden symbol;
#   * the warm/non-warm dispatcher duplication is a forbidden symbol;
#   * normalize_render_job() may be called ONLY at the two canonical entry
#     boundaries (CLI flag boundary + IPC decode boundary) — exactly two
#     call sites in apps/;
#   * the IPC dispatcher/executor never touches a std::string payload again.
# This file is loaded only through tools/architecture_rules.toml; the
# canonical executor remains tools/check_architecture.py.
# ═══════════════════════════════════════════════════════════════════════════

[[forbidden_symbol]]
name = "daemon_render_job_json_reforward"
description = "Phase 9: the daemon RENDER_JOB path must never re-serialize the payload JSON after normalization"
patterns = ['\bforward_payload\b']
skip_comments = true
hint = "Phase 9 removed the JSON re-forward: the daemon hands the immutable NormalizedRenderJob to the render group. Do not restore payload.dump() forwarding."

[[forbidden_symbol]]
name = "warm_and_cold_dispatcher_duplication"
description = "Phase 9: warm renderer is runtime state of ONE execution authority, never a second dispatcher registry"
patterns = ['\bWarmRenderJobDispatcher\b', '\bwarm_render_job_dispatcher\b']
skip_comments = true
hint = "Single RenderJobDispatcher(NormalizedRenderJob, warm_renderer?, execution context). A warm/cold dispatcher pair is a duplicate execution authority."

[[forbidden_symbol]]
name = "ipc_render_job_string_payload_overload"
description = "Phase 9: the render group must never receive/parse a JSON payload string"
patterns = ['ipc_render_job\s*\([^)]*\bstd::string\b']
skip_comments = true
hint = "ipc_render_job takes the normalized job only; a std::string overload would reintroduce a second JSON parse in the execution layer."

[[forbidden_symbol]]
name = "daemon_json_parse_outside_payload_decoder"
description = "Phase 9: JSON decoding in the daemon lives ONLY in the canonical protocol codec and the segment assembler"
patterns = ['nlohmann::json::parse']
scan_paths = ["apps/chronon3d_cli/daemon"]
allow_list = [
  'apps/chronon3d_cli/daemon/daemon_service_ipc_protocol\.cpp',
  'apps/chronon3d_cli/daemon/daemon_service_ipc_dispatch\.cpp',
]
skip_comments = true
hint = "RENDER_JOB JSON decoding goes through daemon_service_ipc_protocol.cpp exclusively. A parse anywhere else in the daemon recreates the pre-Phase-9 re-decode drift."

[[occurrence_cap]]
name = "daemon_json_parse_sites_pinned"
description = "Phase 9: the canonical codec file owns exactly two JSON parse sites (RENDER_JOB decode + ASSEMBLE_SEGMENTS decode)"
pattern = 'nlohmann::json::parse'
scan_paths = ["apps/chronon3d_cli/daemon"]
max_count = 2
allow_list = []
skip_comments = true
hint = "A third parse in the daemon (e.g. a JSON re-forward at dispatch time) fails the gate."

[[occurrence_cap]]
name = "normalize_render_job_canonical_boundaries_only"
description = "Phase 9: normalize_render_job() call sites exist ONLY in the two canonical entry-boundary files (CLI + IPC decode)"
pattern = '\bnormalize_render_job\s*\('
max_count = 0
scan_paths = ["apps/chronon3d_cli"]
allow_list = [
  'apps/chronon3d_cli/daemon/daemon_service_ipc\.cpp',
  'apps/chronon3d_cli/commands/render/command_render_plan_api\.inc',
]
skip_comments = true
hint = "Normalization is the job of the two canonical entry boundaries and nowhere else (the execution layer hard-requires a NormalizedRenderJob). Adding a third call site — a transport forwarder, an executor, a second CLI adapter — fails the gate."

[[occurrence_cap]]
name = "normalized_render_job_type_boundary"
description = "Phase 9: NormalizedRenderJob& crosses the dispatcher boundary only in the render-group + daemon declarations"
pattern = 'NormalizedRenderJob&'
max_count = 0
scan_paths = ["apps/chronon3d_cli"]
allow_list = [
  'apps/chronon3d_cli/daemon/daemon_service\.hpp',
  'apps/chronon3d_cli/commands/render/register_render_commands_body\.inc',
  'apps/chronon3d_cli/commands/render/command_render_plan_api\.inc',
  'apps/chronon3d_cli/commands/render/command_render_plan\.hpp',
]
skip_comments = true
hint = "RenderJobDispatcher is the only crossing point for the normalized job."

[[contract]]
name = "daemon_render_job_payload_canonical_declaration"
description = "Phase 9: the single canonical RENDER_JOB payload decoder declaration must exist"
file = "apps/chronon3d_cli/daemon/daemon_render_job_payload.hpp"
required_pattern = 'decode_render_job_payload\s*\('
hint = "Canonical daemon payload decoder missing."
