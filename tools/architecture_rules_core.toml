# ═══════════════════════════════════════════════════════════════════════════════
# architecture_rules.toml — canonical declarative architecture rules
#
# This file is the SINGLE SOURCE OF TRUTH for all architecture boundary checks.
# It replaces ~10 separate check_*.sh scripts and the 935-line
# check_architecture_boundaries.sh script with a single declarative engine.
#
# Engine: tools/check_architecture.py (reads this file, enforces every rule).
#
# Rule categories:
#   [forbidden_path]        — files/paths that must NOT exist in the repo
#   [forbidden_symbol]      — symbol patterns that must NOT appear in source
#   [forbidden_include]     — #include patterns that must NOT appear
#   [unique_source_owner]   — each concept must have exactly one canonical authority
#   [boundary]              — layer-boundary rules
#   [contract]              — source-code contracts (required patterns in files)
#   [loc_bound]             — LOC and non-local include count bounds
#   [cmake_ownership]       — CMake target source ownership rules
#   [gitignored]            — rules for gitignore enforcement
#
# TOML literal strings ('...') are used for regex patterns to avoid
# double-escaping. Use [ (] for literal '(' and [ )] for literal ')'.
# ═══════════════════════════════════════════════════════════════════════════════

[meta]
version = 1
generated = "2026-08-22"
description = "Consolidated from 15+ gate scripts and check_architecture_boundaries.sh"

