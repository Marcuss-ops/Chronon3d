    "physical_surfaces\\s*;",
    "surface_bindings\\s*;",
    "deferred_surface_releases\\s*;",
    "unplanned_surface_handles\\s*;"
]
hint = "Surface ownership must remain in VulkanSurfaceStore, not be duplicated in backend orchestration."

[[boundary]]
name = "vulkan_compiled_surface_allocation_is_plan_only"
description = "Compiled plan path must never self-allocate: begin_plan_batch binds planned slots only; dynamic slot selection stays confined to the explicit unplanned authority (ensure/next_slot)"
scan_paths = ["src/backends/vulkan/vulkan_backend.cpp"]
forbidden_patterns = [
    "begin_plan_batch.*next_slot\\+\\+",
    "begin_plan_batch.*ensure_surface"
]
hint = "Compiled surface placement is owned by CompiledResourceTable via VulkanSurfaceAuthority::bind; dynamic allocation is confined to the unplanned authority path (create_surface/CUDA external)."

[[boundary]]
name = "vulkan_descriptor_ownership_is_arena_only"
description = "Frame descriptor allocator arrays belong only to VulkanDescriptorArena"
scan_paths = ["src/backends/vulkan/vulkan_backend.cpp"]
forbidden_patterns = [
    "descriptor_allocators\\s*;",
    "text_tile_bin_allocators\\s*;",
    "text_tile_raster_allocators\\s*;"
]
hint = "Descriptor allocator ownership must remain in VulkanDescriptorArena."

[[boundary]]
name = "vulkan_submission_ownership_is_ring_only"
description = "Frame fences and command buffers belong only to VulkanSubmissionRing"
scan_paths = ["src/backends/vulkan"]
forbidden_patterns = [
    "std::array<VkFence,\\s*3>\\s+fences",
    "std::array<VkCommandBuffer,\\s*3>\\s+command_buffers"
]
hint = "Frame submission resources must remain owned by VulkanSubmissionRing."

[[boundary]]
name = "vulkan_kernel_ownership_is_store_only"
description = "Kernel registry and pipeline layouts belong only to VulkanKernelStore"
scan_paths = ["src/backends/vulkan"]
forbidden_patterns = [
    "GpuKernelRegistry\\s+kernel_registry",
    "VkPipelineLayout\\s+pipeline_layout",
    "VkPipelineLayout\\s+text_tile_bin_pipeline_layout",
    "VkPipelineLayout\\s+text_tile_raster_pipeline_layout"
]
hint = "Kernel and pipeline ownership must remain in VulkanKernelStore."

