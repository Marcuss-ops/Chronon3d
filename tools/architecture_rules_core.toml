# ═══════════════════════════════════════════════════════════════════════════════
# CMAKE OWNERSHIP — every C++ source belongs to exactly one CMake target
# ═══════════════════════════════════════════════════════════════════════════════

[cmake_ownership]
description = "Every productive C++ source must belong to exactly one CMake target"

[[cmake_ownership.allowed_multi_owner]]
path = "src/backends/vulkan/cuda_vulkan_surface_bridge.cpp"
owners = ["chronon3d_backend_vulkan", "chronon3d_cuda_vulkan_external_memory_probe"]
reason = "Probe executable must exercise bridge in isolation (no whole-backend link)."

# ═══════════════════════════════════════════════════════════════════════════════
# GITIGNORED — enforce gitignore contract
# ═══════════════════════════════════════════════════════════════════════════════

[gitignored]
description = "Gitignored build/output/dependency-cached directories must NOT contain tracked files"
header_date = "2026-07-06"

dirs = [
    "build", ".worktrees", ".build-logs", ".build-tmp",
    "out", "bin", "lib", "obj", "CMakeFiles", "Testing",
    "vcpkg", "vcpkg_bootstrap", "vcpkg_installed",
    "output", "output/new_features", "renders",
    "temp_assets", "artifacts/visual/camera", "logs",
    ".vs", ".vscode", ".idea", ".claude", ".antigravitycli",
    "__pycache__", ".venv", "venv",
    ".history", "_tmp", "tmp",
]

file_patterns = [
    "build_output.txt", "CMakeCache.txt", "/vcpkg_bootstrap",
    "/test_output_*.png", "/path.json", "camera_path*.json",
    "camera_path_report.json", "CameraTestReport.json",
    "camera_shot_report*.json", "*_state.bin", "*_report*.json",
]

build_globs = ["build-tmp", "build-debug", "build-release", "build-asan", "build-*"]
tmp_gate_globs = [".tmp_gate*"]

absolute_path_pattern = '/home/[A-Za-z]+/Pyt/Chronon3d'
