# ═══════════════════════════════════════════════════════════════════════════════
# BOUNDARY — layer-boundary rules
# ═══════════════════════════════════════════════════════════════════════════════

[[boundary]]
name = "render_graph_cannot_include_software_backend_private"
description = "render_graph cannot include backends/software/include_private"
scan_paths = ["src/render_graph"]
forbidden_patterns = ['backends/software/include_private']
hint = "render_graph must not receive software private include directories."

[[boundary]]
name = "public_render_graph_header_cannot_include_software_backend"
description = "Public render_graph headers cannot include concrete software implementation"
scan_paths = ["include/chronon3d/render_graph"]
forbidden_patterns = ['#include .*backends/software/']
hint = "Public render_graph headers must not depend on concrete software backends."

[[boundary]]
name = "cli_cannot_own_media_decoder_impl"
description = "CLI cannot own media decoder or CUDA/Vulkan compositor"
scan_paths = ["apps/chronon3d_cli"]
forbidden_patterns = ['utils/video/(native_video_frame_decoder|cuda_nv12_surface_compositor)']
hint = "Media decoder implementations belong in src/media/, not in CLI."

[[boundary]]
name = "environment_specific_cuda_paths"
description = "Build config must not contain host-specific CUDA/FFmpeg paths"
forbidden_patterns = [
    '/usr/local/lib/python',
    '/tmp/velox-cuda-dev',
    'libnvrtc\.so\.13',
    'libnvrtc-builtins\.so\.13\.0',
]
scan_paths = ["apps", "src", "include", "docs/CURRENT_STATUS.md", "CMakeLists.txt"]
hint = "CUDA discovery must be environment/toolchain based, not hard-coded paths."

# ═══════════════════════════════════════════════════════════════════════════════
# CONTRACT — required patterns that MUST exist in specific files
# ═══════════════════════════════════════════════════════════════════════════════

[[contract]]
name = "canonical_make_render_job_declaration"
description = "Canonical make_render_job declaration must exist"
file = "apps/chronon3d_cli/utils/job/render_job.hpp"
required_pattern = 'make_render_job\s*\('
hint = "Canonical render CLI entry point missing."

[[contract]]
name = "canonical_execute_render_job_declaration"
description = "Canonical immutable execute_render_job declaration"
file = "apps/chronon3d_cli/utils/job/render_job.hpp"
required_pattern = 'execute_render_job\s*\(\s*const RenderJob&'
hint = "Canonical immutable executor declaration missing."

[[contract]]
name = "canonical_execute_render_job_definition"
description = "Canonical immutable executor definition"
file = "apps/chronon3d_cli/utils/job/render_job_execute.cpp"
required_pattern = 'execute_render_job\s*\(\s*const RenderJob&'
hint = "Canonical immutable executor definition missing."

[[contract]]
name = "canonical_render_command_registration"
description = "Canonical render command registration"
file = "apps/chronon3d_cli/commands/render/register_render_commands.cpp"
required_pattern = 'register_render_commands\s*\('
hint = "Canonical render command registration missing."

[[contract]]
name = "native_decoder_cache_excludes_mutable_surfaces"
description = "Native decoder cache must exclude mutable GPU surfaces"
file = "src/media/video/native_video_frame_decoder.cpp"
optional = true
required_patterns = [
    'const bool native_surface = result->surface_handle\(\)',
    'if \(!native_surface\) \{',
    'session->cache\[target\]\s*=\s*result',
    'native_backend->release_surface\(slot.surface\)',
    'native_surface_registry->release\(slot.surface\)',
    'is_native_surface_valid\(slot.surface\)',
]
hint = "Native decoder cache contract violation: mutable GPU surface wrappers must be excluded."

[[contract]]
name = "native_decoder_concurrency_locking"
description = "Native decoder must expose per-session locking"
file = "include/chronon3d/media/video/native_video_frame_decoder.hpp"
required_patterns = ['std::mutex m_mutex;', 'std::mutex mutex;']

[[contract]]
name = "native_decoder_source_concurrency_lock"
description = "Native decoder source must use std::lock_guard"
file = "src/media/video/native_video_frame_decoder.cpp"
optional = true
required_patterns = [
    'std::lock_guard<std::mutex>\s+lock\(m_mutex\);',
]

[[contract]]
name = "native_decoder_concurrent_test_coverage"
description = "Native decoder test must exercise concurrent-source coverage"
file = "tests/video/test_native_video_frame_decoder.cpp"
optional = true
required_patterns = [
    'std::async[ (]std::launch::async',
    'source_a',
    'source_b',
]

[[contract]]
name = "effect_processor_coverage"
description = "Every catalogued effect must have a software processor registration"
effect_catalog = "include/chronon3d/effects/effect_catalog.def"
processor_registry = "src/backends/software/processors/builtin_processors.cpp"
hint = "Effect catalog and software processor registry must be aligned."

